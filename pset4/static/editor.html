<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DoomDraft</title>
  <style>
    :root {
      --bg: #1e1e2e;
      --fg: #cdd6f4;
      --muted: #6c7086;
      --accent: #89b4fa;
      --surface: #313244;
      --ok: #a6e3a1;
      --warn: #f9e2af;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    #toolbar {
      display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center;
      padding: 0.5rem 0.75rem; background: var(--surface); border-bottom: 1px solid #45475a;
    }
    #toolbar label { font-size: 0.75rem; color: var(--muted); }
    #toolbar input, #toolbar select, #toolbar button {
      background: #181825; color: var(--fg); border: 1px solid #45475a; border-radius: 4px;
      padding: 0.35rem 0.5rem; font: inherit;
    }
    #toolbar button { cursor: pointer; }
    #toolbar button:hover { border-color: var(--accent); }
    #status { margin-left: auto; font-size: 0.8rem; color: var(--muted); }
    #status.ok { color: var(--ok); }
    #status.err { color: #f38ba8; }
    #wrap { position: relative; flex: 1; display: flex; min-height: 0; }
    #main { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    #editor {
      flex: 1; width: 100%; resize: none; margin: 0; padding: 0.75rem;
      background: #11111b; color: var(--fg); border: none; outline: none;
      caret-color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px; line-height: 1.4; tab-size: 4;
    }
    #cursor-overlay {
      pointer-events: none; position: absolute; left: 0.75rem; top: 0.75rem; right: 0.75rem; bottom: 0;
      overflow: hidden; white-space: pre;
    }
    .caret-marker {
      position: absolute; width: 2px; background: var(--accent); opacity: 0.85;
      border-radius: 1px;
    }
    .caret-label {
      position: absolute; transform: translateY(-120%); font-size: 0.65rem;
      padding: 0.1rem 0.25rem; border-radius: 3px; color: #11111b; white-space: nowrap;
    }
  </style>
</head>
<body style="display:flex;flex-direction:column;height:100vh;">
  <div id="toolbar">
    <label>Server <input id="serverUrl" type="text" size="28" value="http://localhost:8080" /></label>
    <label>Doc <input id="docId" type="text" size="12" value="main" /></label>
    <label>Docs <select id="docSelect"></select></label>
    <button type="button" id="btnNewDoc">New doc</button>
    <button type="button" id="btnConnect">Connect</button>
    <label title="Demo only">Fail replica <input id="failReplica" type="text" size="2" placeholder="1" /></label>
    <button type="button" id="btnFail">Fail</button>
    <span id="status">disconnected</span>
    <span id="ver" style="font-size:0.8rem;color:var(--muted);">v —</span>
  </div>
  <div id="main">
    <div id="wrap">
      <textarea id="editor" spellcheck="false" placeholder="Connect, then type…"></textarea>
      <div id="cursor-overlay" aria-hidden="true"></div>
    </div>
  </div>
  <script src="/editor.js"></script>
</body>
</html>
